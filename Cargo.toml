[package]
name = "component-http-client"
description = "HTTP client ACT component"
version = "0.2.5"
edition = "2024"

[dependencies]
act-sdk = "0.14"
serde = { version = "1", features = ["derive"] }
serde_with = "3"
serde_json = "1"
http = "1"
http-serde = "2"
# Same pin family dadata and mcp-bridge carry; `default-features = false`
# keeps the ICU stack (idn/public-suffix) out of the artifact. alpha.18 /
# wasi 0.1.5 carry the ErrorKind::Uri + Body-vs-Connect classification
# this component's migration prompted (hclient repo, 2026-10-05).
hclient = { version = "0.1.0-alpha.18", default-features = false, features = ["idn"] }
hclient-wasi = "0.1.5"
bytes = "1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"

[lib]
crate-type = ["cdylib"]
